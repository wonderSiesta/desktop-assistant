name: Desktop Assistant checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.21.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run privacy:check
